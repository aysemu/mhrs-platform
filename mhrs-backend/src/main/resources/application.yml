server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: mhrs-backend

  # PostgreSQL Veritabanı Bağlantısı
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mhrs_db}
    username: ${DB_USERNAME:mhrs_user}
    password: ${DB_PASSWORD:mhrs_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA & Hibernate Ayarları
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Bağlantısı
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
      timeout: 3000ms

# JWT ve Güvenlik Parametreleri
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000    # 15 dakika
    refresh-token-expiration-ms: 604800000 # 7 günn-ms: 604800000 # 7 gün