version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mhrs-postgres
    restart: always
    environment:
      POSTGRES_DB: mhrs_db
      POSTGRES_USER: mhrs_user
      POSTGRES_PASSWORD: mhrs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhrs_user -d mhrs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mhrs-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./mhrs-backend
      dockerfile: Dockerfile
    container_name: mhrs-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mhrs_db
      SPRING_DATASOURCE_USERNAME: mhrs_user
      SPRING_DATASOURCE_PASSWORD: mhrs_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./mhrs-frontend
      dockerfile: Dockerfile
    container_name: mhrs-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
